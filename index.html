<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Impostors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ana Menü Ekranı -->
    <div id="main-menu" class="screen">
        <div class="menu-content">
            <h1 class="game-title">SPACE IMPOSTORS</h1>
            <p class="game-subtitle">Tek Oyunculu Uzay Gemisi Macerası</p>
            <div class="menu-buttons">
                <button id="btn-play" class="btn primary">OYNA</button>
                <button id="btn-how-to" class="btn secondary">NASIL OYNANIR</button>
                <button id="btn-settings" class="btn secondary">AYARLAR</button>
            </div>
            <div class="version-tag">v0.1.0-alpha</div>
        </div>
    </div>

    <!-- Nasıl Oynanır Modalı -->
    <div id="modal-how-to" class="modal hidden">
        <div class="modal-content">
            <h2>Nasıl Oynanır?</h2>
            <p>Sol alttaki sanal joystick ile karakterini hareket ettir.</p>
            <p>Sağ alttaki eylem butonlarını kullanarak görevleri yap, cesetleri rapor et ve toplantılar düzenle.</p>
            <button id="close-how-to" class="btn primary">KAPAT</button>
        </div>
    </div>

    <!-- Ayarlar Modalı -->
    <div id="modal-settings" class="modal hidden">
        <div class="modal-content">
            <h2>Ayarlar</h2>
            <div class="setting-item">
                <label>Oyuncu Adı:</label>
                <input type="text" id="player-name-input" value="Kaptan" maxlength="10">
            </div>
            <div class="setting-item">
                <label>Karakter Rengi:</label>
                <select id="player-color-select">
                    <option value="#ff0000">Kırmızı</option>
                    <option value="#0051ff" selected>Mavi</option>
                    <option value="#00ff22">Yeşil</option>
                    <option value="#ffee00">Sarı</option>
                    <option value="#9900ff">Mor</option>
                    <option value="#ff7700">Turuncu</option>
                </select>
            </div>
            <button id="close-settings" class="btn primary">KAYDET VE Kapat</button>
        </div>
    </div>

    <!-- Oyun Ekranı -->
    <div id="game-container" class="screen hidden">
        <canvas id="game-canvas"></canvas>

        <!-- Mobil Joystick (Sol Alt) -->
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <!-- Sağ Alt Eylem Butonları -->
        <div id="action-buttons">
            <button id="btn-action" class="action-btn" disabled>KULLAN</button>
            <button id="btn-report" class="action-btn secondary-btn" disabled>RAPOR</button>
            <button id="btn-map" class="action-btn secondary-btn">HARİTA</button>
        </div>

        <!-- Üst Bilgi Çubuğu -->
        <div id="hud-bar">
            <div id="task-progress-container">
                <span>Görev İlerlemesi:</span>
                <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
                <span id="progress-text">%0</span>
            </div>
            <div id="player-hud-name">Kaptan</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
